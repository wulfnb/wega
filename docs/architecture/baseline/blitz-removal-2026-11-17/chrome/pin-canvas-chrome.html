<!doctype html><meta charset=utf-8><style>body{margin:0;background:white;color:black;font-family:Arial;font-size:16px;line-height:20px}*{box-sizing:border-box}p{margin:0}input,textarea,button{font-family:Arial;font-size:16px;line-height:20px}</style><canvas data-probe id=c width=140 height=70 style='display:block'></canvas><script>addEventListener('load',()=>{var x=document.getElementById('c').getContext('2d');x.fillStyle='red';x.fillRect(0,0,140,70);x.save();x.translate(20,10);x.fillStyle='blue';x.fillRect(0,0,40,30);x.restore();window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
