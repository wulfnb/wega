<!doctype html><style>body{margin:0;font:16px/20px Arial}*{box-sizing:border-box}</style><div data-probe id=column style='display:flex;flex-direction:column;width:400px'><main data-probe id=main style='display:flex;flex-direction:column;flex:1'><header data-probe id=header><div style='height:70px;background:red'></div></header><section data-probe id=section style='padding:10px 0'><div style='height:90px;background:blue'></div></section></main><footer data-probe id=footer style='height:40px;background:green'></footer></div><script>addEventListener('load',()=>{;window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
