<!doctype html><style>body{margin:0;font:16px/20px Arial}*{box-sizing:border-box}</style><div style='display:flex;width:600px'><div data-probe id=auto style='padding:0 20px;border:2px solid red;background:yellow;color:transparent'>Width</div><div data-probe id=basis style='box-sizing:content-box;flex:0 0 100px;padding:0 20px;border:2px solid blue;height:30px'></div><div data-probe id=rest style='flex:1;height:30px;background:green'></div></div><script>addEventListener('load',()=>{;window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
