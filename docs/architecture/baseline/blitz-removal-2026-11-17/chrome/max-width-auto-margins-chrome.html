<!doctype html><style>body{margin:0;font:16px/20px Arial}*{box-sizing:border-box}</style><body data-probe id=body style='max-width:300px;margin:auto;padding:20px;background:yellow'><div data-probe id=content style='height:80px;background:red'></div><script>addEventListener('load',()=>{;window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
