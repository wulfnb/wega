<!doctype html><meta charset=utf-8><style>body{margin:0;background:white;color:black;font-family:Arial;font-size:16px;line-height:20px}*{box-sizing:border-box}p{margin:0}input,textarea,button{font-family:Arial;font-size:16px;line-height:20px}</style><div data-probe id=a style='width:80px;height:40px;background:red'></div><button id=b style='display:none'>Change</button><script>addEventListener('load',()=>{document.getElementById('b').addEventListener('click',()=>{let a=document.getElementById('a');a.style.width='180px';a.style.backgroundColor='blue';let child=document.createElement('div');child.style.height='20px';child.style.backgroundColor='green';a.appendChild(child)});document.getElementById('b').click();window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
