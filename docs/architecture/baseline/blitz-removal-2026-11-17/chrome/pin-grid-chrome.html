<!doctype html><meta charset=utf-8><style>body{margin:0;background:white;color:black;font-family:Arial;font-size:16px;line-height:20px}*{box-sizing:border-box}p{margin:0}input,textarea,button{font-family:Arial;font-size:16px;line-height:20px}</style><div data-probe id=g style='display:grid;width:320px;height:110px;grid-template-columns:100px 1fr;grid-template-rows:40px 60px;gap:10px'><div data-probe id=a style='background:red'></div><div data-probe id=b style='background:blue'></div><div data-probe id=c style='grid-column:1 / span 2;background:green'></div></div><script>addEventListener('load',()=>{;window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
