<!doctype html><style>body{margin:0;font:16px/20px Arial}*{box-sizing:border-box}</style><style>:root{--sidebar:200px}.sidebar{flex:0 0 var(--sidebar)}.later{flex:0 0 var(--sidebar);flex-basis:150px}</style><div style='display:flex;width:600px'><nav data-probe id=sidebar class=sidebar style='overflow:hidden;height:100px;background:red'></nav><main data-probe id=main style='flex:1;min-width:0;height:120px;background:blue'></main></div><div style='display:flex;width:600px'><nav data-probe id=later class=later style='height:50px;background:green'></nav><main data-probe id=other style='flex:1;height:50px'></main></div><script>addEventListener('load',()=>{;window.scrollTo(0,0);document.documentElement.setAttribute('data-wega-geometry',btoa(JSON.stringify(Array.from(document.querySelectorAll('[data-probe]')).map(e=>{let r=e.getBoundingClientRect();return [e.id,r.x,r.y,r.width,r.height]}))))})</script>
