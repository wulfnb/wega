[package]
name = "wega-error-collector"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
actix-web = {version="4",default-features=false,features=["macros"]}
serde = {version="1",features=["derive"]}
serde_json = "1"
chrono = {version="0.4",features=["serde"]}
rusqlite = {version="0.38",features=["bundled"]}
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
