[package]
name = "wega"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
description = "Wega — a native Rust browser, with movable tabs"
license = "MPL-2.0"
repository = "https://github.com/wulfnb/wega"
publish = false
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:surfman", "dep:glow", "dep:reqwest", "dep:log", "dep:wega-platform", "dep:wega-network", "dep:windows-sys", "dep:rfd", "dep:accesskit", "dep:egui-winit", "dep:egui", "dep:egui_glow", "dep:winit", "dep:euclid", "dep:dpi", "dep:rustls", "dep:arboard", "dep:crossbeam-channel", "dep:webdriver", "dep:base64", "dep:image", "dep:http", "dep:libc", "dep:objc2", "dep:block2", "dep:objc2-app-kit", "dep:objc2-foundation"]
test-harness = ["desktop"]
webidl-tools = []

[[bin]]
name = "wega"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "wega-webidl"
path = "tools/webidl/main.rs"
required-features = ["webidl-tools"]

[dependencies]
surfman = { version = "=0.14.0", features = ["sm-angle-default"], optional = true }
glow = { version = "=0.17.0", optional = true }
ed25519-dalek = "=3.0.0"
sha2 = "=0.11.1"
wega-protocol = { path = "engines/protocol" }
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls"],optional=true}
log = {version="0.4",optional=true}
wega-platform = {path="engines/platform",optional=true}
wega-network = {path="engines/network",optional=true}
rfd = { version = "=0.17.2", optional = true }
accesskit = { version = "=0.25.2", features = ["serde"], optional = true }
egui-winit = { version = "=0.37.0", features = ["accesskit"], optional = true }
egui = { optional = true, version = "=0.37.0", features = ["default_fonts"] }
egui_glow = { optional = true, version = "=0.37.0", features = ["winit"] }
winit = { version = "0.30.13", optional = true }
euclid = { version = "0.22", optional = true }
dpi = { version = "0.1", optional = true }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
directories = "6"
rustls = { optional = true, version = "0.23", default-features = false, features = ["aws_lc_rs"] }
arboard = { version = "3", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
webdriver = { version = "=0.54.0", optional = true }
base64 = { version = "0.22", optional = true }
image = { optional = true,version="0.25",default-features=false,features=["png"]}
http = { version = "1", optional = true }
chrono = "0.4.45"
libc = { version = "0.2", optional = true }

[profile.dev]
debug = 0
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Console", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
block2 = { version = "0.6.2", optional = true }
objc2-app-kit = { optional = true,version="0.3.2",default-features=false,features=["std","NSVisualEffectView","NSView","NSWindow","NSColor","NSAppearance","NSGraphics","NSResponder","NSScreen"]}
objc2-foundation = { optional = true,version="0.3.2",default-features=false,features=["std","NSAppleEventDescriptor","NSAppleEventManager","NSArray","NSURL","NSGeometry","NSString","NSDictionary","NSValue"]}
