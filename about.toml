# cargo-about configuration for THIRD-PARTY-NOTICES.html.
# v8 declares its Rust wrapper MIT license. about.hbs separately includes the
# pinned V8 C++ BSD-3-Clause license from engines/vendor/v8-notices/LICENSE.
# Generated by scripts/third-party-notices.sh; see docs/licensing.md.
#
# `accepted` lists every SPDX identifier present in the release dependency graph
# (checked with `cargo metadata --filter-platform` for aarch64-apple-darwin,
# x86_64-unknown-linux-gnu and x86_64-pc-windows-msvc). For an `A OR B`
# expression cargo-about picks the first accepted entry in this order, so the
# permissive licenses come first. GPL-2.0-only is intentionally absent: the one
# crate offering it (self_cell) is dual-licensed and used under Apache-2.0.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]

# Test-only crates are never shipped. Build dependencies stay listed: some of
# them (bindgen output, generated tables) end up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# egui's bundled default fonts are compiled into every desktop binary. The crate
# ships their license texts under fonts/ but no MIT/Apache file for the crate
# code, so the font files are clarified explicitly here; the crate code's
# MIT text falls back to the canonical SPDX text. Re-check the checksums when
# epaint_default_fonts is upgraded (cargo-about fails loudly on a mismatch).
[epaint_default_fonts.clarify]
license = "MIT AND OFL-1.1 AND Ubuntu-font-1.0 AND Bitstream-Vera"

[[epaint_default_fonts.clarify.files]]
# Noto Emoji (NotoEmoji-Regular.ttf)
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
# Ubuntu Light (Ubuntu-Light.ttf)
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
# Hack (Hack-Regular.ttf): MIT plus the Bitstream Vera License for Vera glyphs
path = "fonts/Hack-Regular.txt"
license = "MIT AND Bitstream-Vera"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"

[[epaint_default_fonts.clarify.files]]
# emoji-icon-font / egui-icons subset (emoji-icon-font.ttf, egui-icons.ttf)
path = "fonts/emoji-icon-font-mit-license.txt"
license = "MIT"
checksum = "b9d2c1d909aa149996fd4c91dcb92b2362a04431640c1d200959da94caf8cde1"
