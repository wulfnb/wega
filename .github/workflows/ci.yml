name: CI

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.scope.outputs.lint }}
      engine-validation: ${{ steps.scope.outputs.engine-validation }}
      error-collector: ${{ steps.scope.outputs.error-collector }}
      core-matrix: ${{ steps.scope.outputs.core-matrix }}
      desktop-macos: ${{ steps.scope.outputs.desktop-macos }}
      desktop-windows: ${{ steps.scope.outputs.desktop-windows }}
      linux-binaries: ${{ steps.scope.outputs.linux-binaries }}
      docker-integration: ${{ steps.scope.outputs.docker-integration }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Compare the tested PR merge against its first parent, without downloading history.
      # Pull requests run only the jobs their paths can affect (scripts/ci-scope.py);
      # every push, merge and release still runs the complete suite.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
          else
            : > changed.txt
          fi
          cat changed.txt
          python3 scripts/ci-scope.py select < changed.txt | tee -a "$GITHUB_OUTPUT"

  engine-validation:
    name: Required engine validation
    needs: changes
    if: needs.changes.outputs.engine-validation == 'true'
    uses: ./.github/workflows/standalone-engine-validation.yml
    permissions:
      contents: read

  lint:
    name: Code Quality & Lints
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow, shell, and secret analysis tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz"
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tar.gz"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate workflows, shell scripts, and Python syntax
        run: |
          actionlint
          shellcheck scripts/*.sh
          python3 -m compileall -q scripts tests
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-ci-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting check
        run: cargo fmt --check
      - name: Verify standalone engine dependency boundary
        run: python3 scripts/check-engine-boundary.py
      - name: Core lints
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: JavaScript line coverage (100% required)
        run: sh scripts/javascript-coverage.sh
      - name: Install security analysis tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      # Keep registry fetching enabled: --no-fetch also prevents cargo-audit
      # from loading sparse index entries needed for yanked checks.
      - name: Audit browser, collector and spike dependencies for security vulnerabilities
        run: |
          cargo audit
          cargo audit --file error-collector/Cargo.lock
          cargo audit --file engines/v8-spike/Cargo.lock
      # engines/.cargo/audit.toml lists the advisories pinned by Deno, each with its
      # fix; any other engine advisory fails here (see docs/ci-release-fixes.md).
      - name: Audit engine dependencies (pinned Deno advisories listed explicitly)
        working-directory: engines
        run: cargo audit
      - name: Scan repository for secret and credential leaks
        run: gitleaks detect --verbose --config .gitleaks.toml

  error-collector:
    name: Error collector and signed HTTP contract
    needs: [changes, lint]
    if: needs.changes.outputs.error-collector == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: error-collector
          shared-key: wega-error-collector
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting, lints and regressions
        run: |
          cargo fmt --manifest-path error-collector/Cargo.toml --check
          cargo clippy --locked --manifest-path error-collector/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path error-collector/Cargo.toml
      - name: Static image and authenticated HTTP contract
        run: |
          docker build -f error-collector/Dockerfile -t wega-error-collector:ci .
          python3 -m venv /tmp/wega-collector-tests
          /tmp/wega-collector-tests/bin/pip install cryptography==46.0.7
          /tmp/wega-collector-tests/bin/python error-collector/tests/container_smoke.py --image wega-error-collector:ci

  core-matrix:
    name: Core Suite (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.core-matrix == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS runs these checks inside desktop-macos: macOS runners are the scarce ones.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.os == 'Linux'
        with:
          shared-key: "wega-core-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core unit tests
        run: cargo test --locked --no-default-features --lib
      - name: Core documentation tests
        run: cargo test --locked --no-default-features --doc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-dev.txt
      # coverage.sh runs the Python suite on Linux; macOS runs it with desktop coverage.
      - name: Install coverage tool
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Core coverage and regression gate
        if: runner.os == 'Linux'
        run: sh scripts/coverage.sh
      - name: Core platform line measurement
        if: runner.os != 'Linux'
        run: python scripts/desktop-coverage.py --core-only --output target/coverage/builds/${{ runner.os }}-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-coverage-${{ runner.os }}
          path: target/coverage/
          include-hidden-files: true

  desktop-macos:
    name: Desktop Native & Engine Suite (macOS)
    needs: [changes, lint, engine-validation]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.desktop-macos == 'true' &&
      (needs.engine-validation.result == 'success' || needs.engine-validation.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 90
    # No job-level CARGO_* variables: they are part of rust-cache's key, and the
    # engine cache below must match the key engine validation saved.
    env:
      WEGA_TEST_ALLOW_LOOPBACK: '1'
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-desktop-macos"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Restore engine validation's cache for this OS (read-only) instead of keeping a
      # second copy here. It must come after the root cache: a partial root restore
      # cleans target/, which contains target/wega-engine.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: standalone-engine-native-worker-v4-macos-15
          workspaces: 'engines -> ../target/wega-engine'
          save-if: false
      - name: Native system dependencies
        run: brew install pkgconf gstreamer libnice-gstreamer
      - name: Production lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Harness lints
        run: cargo clippy --locked --all-targets --features test-harness -- -D warnings
      - name: Core unit and documentation tests (no default features)
        run: |
          cargo test --locked --no-default-features --lib
          cargo test --locked --no-default-features --doc
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: JavaScript line coverage
        run: sh scripts/javascript-coverage.sh
      - name: Gateway and release-tool tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage html
          python -m coverage xml
          python -m coverage json
      # Workspace regressions and native sandbox checks run once in engine-validation.
      - name: Build the independent Wega engine for desktop integration
        run: |
          python scripts/build-wega-engine.py --debug
          cargo build --locked --manifest-path engines/Cargo.toml --target-dir target/wega-engine -p wega-platform --bin wega-content-bundle
          helper=$(target/wega-engine/debug/wega-content-bundle target/debug/wega-engine "$RUNNER_TEMP/DesktopEngine.app")
          echo "WEGA_ENGINE_BINARY=$helper" >> "$GITHUB_ENV"
      - name: Instrumented unit and real engine coverage
        run: python scripts/desktop-coverage.py
      # desktop-coverage.py already runs every native suite with the instrumented browser.
      - name: Native container account isolation and window handoff
        run: python tests/containers_smoke.py --binary target/debug/wega --output target/containers-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: containers-macos
          path: target/containers-validation/${{ github.run_id }}-${{ github.run_attempt }}/
      # Cargo caches can restore old reports; every workflow attempt needs a fresh output.
      - name: Standalone compatibility and process-tree baseline
        if: github.event_name != 'pull_request'
        run: python scripts/browser-bench.py --output target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }} --repeats 1 --tabs 1 5 --idle-seconds 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-macos
          path: target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Whole-project completeness inventory
        run: python scripts/coverage-inventory.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-coverage-macos
          path: |
            target/coverage/
            !target/coverage/desktop/objects/

  linux-binaries:
    name: Linux Binaries for Docker (test harness)
    needs: [changes, lint]
    if: needs.changes.outputs.linux-binaries == 'true'
    runs-on: ubuntu-24.04
    # Same RUST_IMAGE as compose.quality.yaml, so the binaries match the trixie runtime.
    container: rust:1.98.0-slim-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native build dependencies
        run: apt-get update && xargs -a docker/builder-packages.txt apt-get install -y --no-install-recommends
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      # Shared with CD's Linux build (same script, container and release profile).
      # Root and engine are separate caches: one cache for both would prune the
      # engine's dependencies, because target/wega-engine sits inside target/.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-linux-release"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-linux-release-engine"
          workspaces: 'engines -> ../target/wega-engine'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build test-harness binaries
        run: bash scripts/build-linux-binaries.sh dist/docker test-harness
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binaries-test-harness
          path: dist/docker/
          retention-days: 1

  docker-integration:
    name: Docker & Web Gateway Integration (Linux)
    needs: [changes, linux-binaries]
    if: needs.changes.outputs.docker-integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: compose.quality.yaml
      COMPOSE_PROJECT_NAME: wega-ci-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate disposable test credentials
        run: echo "WEGA_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-binaries-test-harness
          path: dist/docker
      # Artifacts drop the executable bit.
      - name: Restore binary permissions
        run: chmod 755 dist/docker/wega dist/docker/wega-engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the runtime layers are built here; CD keeps their cache in GHCR.
      - name: Build test container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime-prebuilt
          # Refresh distro security updates even when the base digest is unchanged.
          pull: true
          no-cache-filters: desktop
          push: false
          load: true
          provenance: false
          tags: wega-quality:local
          cache-from: type=registry,ref=ghcr.io/wulfnb/wega:buildcache
      - name: Scan test Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: wega-quality:local
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Launch test environment
        run: docker compose up -d --wait --wait-timeout 180
      - name: Test authentication gateway & WebSocket revocation
        run: sh scripts/docker-account-test.sh
      - name: Test viewer uploads and nginx security boundaries
        run: python3 scripts/docker-ux-test.py "$(docker compose images -q wega)"
      - name: Test real viewer rendering and touch gestures
        run: node tests/viewer_live.mjs "$(docker compose images -q wega)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: viewer-live-linux
          path: target/viewer-live/
      - name: Test headless browser smoke & rendering
        run: sh scripts/docker-smoke.sh
      - name: Test streaming download pipeline
        run: sh scripts/docker-download-test.sh
      - name: Standalone compatibility and process-tree baseline in Linux
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh \
            -e HOME=/tmp -e XDG_CONFIG_HOME=/tmp/config -e XDG_CACHE_HOME=/tmp/cache -e XDG_DATA_HOME=/tmp/data \
            -e DISPLAY=:97 -e LIBGL_ALWAYS_SOFTWARE=1 -e GITHUB_SHA \
            -e WEGA_TEST_ALLOW_LOOPBACK=1 \
            -v "$PWD:/source:ro" -v "$PWD/target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}:/results" \
            "$(docker compose images -q wega)" -eu -c '
              Xvfb :97 -screen 0 1440x900x24 -nolisten tcp -ac >/tmp/bench-display.log 2>&1 &
              display_pid=$!
              trap "kill $display_pid 2>/dev/null || true" EXIT
              attempts=0
              until xdpyinfo >/dev/null 2>&1; do
                attempts=$((attempts + 1)); test "$attempts" -le 50; sleep 0.2
              done
              python3 /source/scripts/browser-bench.py --binary /usr/local/bin/wega --output /results/run --repeats 1 --tabs 1 5 --idle-seconds 5
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-linux
          path: target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Shell adapter contracts and coverage
        run: |
          docker tag "$(docker compose images -q wega)" wega-shell-base:ci
          docker build --build-arg WEGA_BASE=wega-shell-base:ci -f docker/coverage.Dockerfile -t wega-coverage-tools:ci .
          mkdir -p target/coverage/shell
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/target/coverage/shell:/output" wega-coverage-tools:ci /usr/bin/python3 /source/tests/shell_contracts.py --source /source --output /output
      # The collector runs as root and mkdtemp creates private 0700 directories.
      # Restore runner access even when collection fails so partial reports upload.
      - name: Make shell coverage artifacts readable by the runner
        if: always()
        run: |
          if [ -d target/coverage/shell ]; then
            sudo chown -R "$(id -u):$(id -g)" target/coverage/shell
            chmod -R u+rwX target/coverage/shell
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shell-coverage-linux
          path: target/coverage/shell/
      - name: Collect container logs on failure
        if: always()
        run: docker compose logs --no-color > docker-ci.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-ci-logs
          path: docker-ci.log
      - name: Clean up test containers
        if: always()
        run: docker compose down -v

  desktop-windows:
    name: Desktop Build & Launch (Windows)
    needs: [changes, lint, engine-validation]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.desktop-windows == 'true' &&
      (needs.engine-validation.result == 'success' || needs.engine-validation.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-desktop-windows"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Restore engine validation's cache for this OS (read-only) instead of keeping a
      # second copy here. It must come after the root cache: a partial root restore
      # cleans target/, which contains target/wega-engine.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: standalone-engine-native-worker-v4-windows-2022
          workspaces: 'engines -> ../target/wega-engine'
          save-if: false
      # Engine validation saves the MSVC Skia build; this job only reuses it.
      - name: Restore the MSVC Skia build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/skia-msvc
          key: skia-msvc-dev-${{ hashFiles('engines/vendor/blitz/skia-bindings/**', 'engines/vendor/blitz/patches/skia-bindings.patch') }}
      - name: Use the cached MSVC Skia build
        shell: bash
        run: python scripts/skia-msvc-cache.py prepare "$RUNNER_TEMP/skia-msvc" --github-env "$GITHUB_ENV"
      - name: Restore pinned media SDK installer
        id: media-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: gstreamer-msvc-1.28.8-${{ hashFiles('scripts/install-windows-media.ps1') }}
      - name: Install pinned media SDK
        shell: pwsh
        run: scripts\install-windows-media.ps1
      - name: Save pinned media SDK installer
        if: steps.media-sdk.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: ${{ steps.media-sdk.outputs.cache-primary-key }}
      - name: Build the desktop browser
        env:
          RUSTFLAGS: "-C link-arg=msvcprt.lib"
        run: cargo build --locked --no-default-features --features desktop
      - name: Build the independent Wega engine
        run: python scripts/build-wega-engine.py --debug
      - name: Browser executable has no console subsystem
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dumpbin is unavailable' }
          $headers = & $dumpbin /HEADERS target/debug/wega.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect browser PE headers' }
          if (-not ($headers -match '2 subsystem \(Windows GUI\)')) { throw 'Browser must be a Windows GUI executable' }
      - name: Launch the browser
        shell: pwsh
        run: |
          foreach ($dll in "libEGL.dll", "libGLESv2.dll") {
            Copy-Item (Get-ChildItem "target\debug\build\mozangle-*\out\$dll" | Select-Object -First 1).FullName -Destination "target\debug\"
          }
          python scripts\bundle-windows-media.py --destination target\debug
          if ($LASTEXITCODE -ne 0) { throw "Media runtime bundling failed" }
          scripts\windows-launch-check.ps1 -Directory target\debug
      - name: Standalone worker and same-profile launch handoff
        env:
          WEGA_TEST_ALLOW_LOOPBACK: '1'
        run: python scripts/windows-runtime-test.py --binary target/debug/wega.exe
      - name: Standalone compatibility and process-tree baseline
        if: github.event_name != 'pull_request'
        env:
          WEGA_TEST_ALLOW_LOOPBACK: '1'
        run: python scripts/browser-bench.py --binary target/debug/wega.exe --output target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }} --repeats 1 --tabs 1 5 --idle-seconds 10
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-windows
          path: target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-runtime-ci
          path: target/windows-runtime-tests/

  ci-gate:
    name: CI Completion Gate
    if: always()
    needs: [changes, lint, error-collector, engine-validation, core-matrix, desktop-macos, desktop-windows, linux-binaries, docker-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-scope.py
          sparse-checkout-cone-mode: false
      # A job may be skipped only when the scope did not select it; a skip caused by
      # a failed dependency of a selected job fails the gate.
      - name: Verify every selected check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-scope.py gate
