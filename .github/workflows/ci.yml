name: CI

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Pull requests that only touch the V8 migration are covered by v8-engine.yml.
      # Everything else, and every push/merge/release (cd.yml calls this workflow),
      # runs the complete suite.
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed.txt
          cat changed.txt
          if grep -vE '^(engines/v8-spike/|engines/vendor/|docs/v8-engine-plan\.md$|\.github/workflows/v8-engine\.yml$)' changed.txt | grep -q .; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only V8 migration files changed; the V8 Engine workflow covers them."
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Code Quality & Lints
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-ci-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting check
        run: cargo fmt --check
      - name: Core lints
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
      - name: JavaScript line coverage (100% required)
        run: sh scripts/javascript-coverage.sh

  core-matrix:
    name: Core Suite (${{ matrix.os }})
    needs: [changes, lint]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-core-${{ matrix.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Core unit tests
        run: cargo test --locked --no-default-features --lib
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install Python dev dependencies
        if: runner.os != 'Windows'
        run: python -m pip install -r requirements-dev.txt
      - name: Gateway and tooling unit tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install coverage tool
        if: runner.os == 'Linux'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Core coverage and regression gate
        if: runner.os == 'Linux'
        run: sh scripts/coverage.sh
      - name: Core platform line measurement
        if: runner.os != 'Linux'
        run: python scripts/desktop-coverage.py --core-only --output target/coverage/builds/${{ runner.os }}-core
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: core-coverage-${{ runner.os }}
          path: target/coverage/
          include-hidden-files: true

  desktop-macos:
    name: Desktop Native & Engine Suite (macOS)
    needs: [changes, lint]
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-desktop-macos"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native system dependencies
        run: brew install pkgconf gstreamer libnice-gstreamer
      - name: Production lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Harness lints
        run: cargo clippy --locked --all-targets --features test-harness -- -D warnings
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
      - name: JavaScript line coverage
        run: sh scripts/javascript-coverage.sh
      - name: Gateway and release-tool tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage html
          python -m coverage xml
          python -m coverage json
      - name: Build and test the independent Wega engine
        run: |
          python scripts/build-wega-engine.py --debug
          cargo test --locked --workspace --manifest-path engines/Cargo.toml --target-dir target/wega-engine
          WEGA_TEST_BROKER=1 cargo test --locked --manifest-path engines/Cargo.toml --target-dir target/wega-engine -p wega-engine --test security --test forms --test scripts --test documents --test history
          cargo clippy --locked --workspace --manifest-path engines/Cargo.toml --target-dir target/wega-engine --all-targets -- -D warnings
          cargo fmt --manifest-path engines/Cargo.toml --all --check
      - name: Instrumented unit and real engine coverage
        run: python scripts/desktop-coverage.py
      - name: Native integration suite verification
        run: python scripts/native-tests.py --suite all
      - name: Native container account isolation and window handoff
        run: python tests/containers_smoke.py --binary target/debug/wega --output target/containers-validation/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: containers-macos
          path: target/containers-validation/${{ github.run_id }}-${{ github.run_attempt }}/
      # Cargo caches can restore old reports; every workflow attempt needs a fresh output.
      - name: Two-engine compatibility and process-tree baseline
        if: github.event_name != 'pull_request'
        run: python scripts/browser-bench.py --output target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }} --repeats 1 --tabs 1 5 --idle-seconds 5
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-macos
          path: target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Whole-project completeness inventory
        run: python scripts/coverage-inventory.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: desktop-coverage-macos
          path: |
            target/coverage/
            !target/coverage/desktop/objects/

  linux-binaries:
    name: Linux Binaries for Docker (test harness)
    needs: [changes, lint]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Same RUST_IMAGE as compose.quality.yaml, so the binaries match the trixie runtime.
    container: rust:1.98.0-slim-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Native build dependencies
        run: apt-get update && xargs -a docker/builder-packages.txt apt-get install -y --no-install-recommends
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-linux-harness"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build test-harness binaries
        run: bash scripts/build-linux-binaries.sh dist/docker test-harness
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-binaries-test-harness
          path: dist/docker/
          retention-days: 1

  docker-integration:
    name: Docker & Web Gateway Integration (Linux)
    needs: [changes, linux-binaries]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_FILE: compose.quality.yaml
      COMPOSE_PROJECT_NAME: wega-ci-docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate disposable test credentials
        run: echo "WEGA_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-binaries-test-harness
          path: dist/docker
      # Artifacts drop the executable bit.
      - name: Restore binary permissions
        run: chmod 755 dist/docker/wega dist/docker/wega-engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the runtime layers are built here; CD keeps their cache in GHCR.
      - name: Build test container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: runtime-prebuilt
          push: false
          load: true
          provenance: false
          tags: wega-quality:local
          cache-from: type=registry,ref=ghcr.io/wulfnb/wega:buildcache
      - name: Launch test environment
        run: docker compose up -d --wait --wait-timeout 180
      - name: Test authentication gateway & WebSocket revocation
        run: sh scripts/docker-account-test.sh
      - name: Test viewer uploads and nginx security boundaries
        run: python3 scripts/docker-ux-test.py "$(docker compose images -q wega)"
      - name: Test real viewer rendering and touch gestures
        run: node tests/viewer_live.mjs "$(docker compose images -q wega)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: viewer-live-linux
          path: target/viewer-live/
      - name: Test headless browser smoke & rendering
        run: sh scripts/docker-smoke.sh
      - name: Test developer tools & toolbox
        run: sh scripts/docker-toolbox-test.sh
      - name: Test streaming download pipeline
        run: sh scripts/docker-download-test.sh
      - name: Two-engine compatibility and process-tree baseline in Linux
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh \
            -e HOME=/tmp -e XDG_CONFIG_HOME=/tmp/config -e XDG_CACHE_HOME=/tmp/cache -e XDG_DATA_HOME=/tmp/data \
            -e DISPLAY=:97 -e LIBGL_ALWAYS_SOFTWARE=1 -e GITHUB_SHA \
            -v "$PWD:/source:ro" -v "$PWD/target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}:/results" \
            "$(docker compose images -q wega)" -eu -c '
              Xvfb :97 -screen 0 1440x900x24 -nolisten tcp -ac >/tmp/bench-display.log 2>&1 &
              display_pid=$!
              trap "kill $display_pid 2>/dev/null || true" EXIT
              attempts=0
              until xdpyinfo >/dev/null 2>&1; do
                attempts=$((attempts + 1)); test "$attempts" -le 50; sleep 0.2
              done
              python3 /source/scripts/browser-bench.py --binary /usr/local/bin/wega --output /results/run --repeats 1 --tabs 1 5 --idle-seconds 5
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-linux
          path: target/browser-bench-linux/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Shell adapter contracts and coverage
        run: |
          docker tag "$(docker compose images -q wega)" wega-shell-base:ci
          docker build --build-arg WEGA_BASE=wega-shell-base:ci -f docker/coverage.Dockerfile -t wega-coverage-tools:ci .
          mkdir -p target/coverage/shell
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/target/coverage/shell:/output" wega-coverage-tools:ci /usr/bin/python3 /source/tests/shell_contracts.py --source /source --output /output
      # The collector runs as root and mkdtemp creates private 0700 directories.
      # Restore runner access even when collection fails so partial reports upload.
      - name: Make shell coverage artifacts readable by the runner
        if: always()
        run: |
          if [ -d target/coverage/shell ]; then
            sudo chown -R "$(id -u):$(id -g)" target/coverage/shell
            chmod -R u+rwX target/coverage/shell
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: shell-coverage-linux
          path: target/coverage/shell/
      - name: Collect container logs on failure
        if: always()
        run: docker compose logs --no-color > docker-ci.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: docker-ci-logs
          path: docker-ci.log
      - name: Clean up test containers
        if: always()
        run: docker compose down -v

  desktop-windows:
    name: Desktop Build & Launch (Windows)
    needs: [changes, lint]
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-desktop-windows"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore pinned media SDK installer
        id: media-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: gstreamer-msvc-1.28.8-${{ hashFiles('scripts/install-windows-media.ps1') }}
      - name: Install pinned media SDK
        shell: pwsh
        run: scripts\install-windows-media.ps1
      - name: Save pinned media SDK installer
        if: steps.media-sdk.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: ${{ steps.media-sdk.outputs.cache-primary-key }}
      - name: Build the independent Wega engine
        run: python scripts/build-wega-engine.py --debug
      - name: Build the desktop browser
        run: cargo build --locked --no-default-features --features desktop,brotli-streams,media
      - name: Launch the browser
        shell: pwsh
        run: |
          foreach ($dll in "libEGL.dll", "libGLESv2.dll") {
            Copy-Item (Get-ChildItem "target\debug\build\mozangle-*\out\$dll" | Select-Object -First 1).FullName -Destination "target\debug\"
          }
          python scripts\bundle-windows-media.py --destination target\debug
          if ($LASTEXITCODE -ne 0) { throw "Media runtime bundling failed" }
          scripts\windows-launch-check.ps1 -Directory target\debug
      - name: Real media playback and same-profile launch handoff
        run: python scripts/windows-runtime-test.py --binary target/debug/wega.exe
      - name: Two-engine compatibility and process-tree baseline
        if: github.event_name != 'pull_request'
        run: python scripts/browser-bench.py --binary target/debug/wega.exe --output target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }} --repeats 1 --tabs 1 5 --idle-seconds 10
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && github.event_name != 'pull_request'
        with:
          name: browser-bench-windows
          path: target/browser-bench-ci/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: windows-runtime-ci
          path: target/windows-runtime-tests/

  ci-gate:
    name: CI Completion Gate
    if: always()
    needs: [changes, lint, core-matrix, desktop-macos, desktop-windows, linux-binaries, docker-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all checks passed
        env:
          FULL: ${{ needs.changes.outputs.full }}
          SCOPE: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Scope: full=$FULL; results: $RESULTS"
          test "$SCOPE" = success
          # Skips are only acceptable when the scope job chose a V8-only run.
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) test "$FULL" = false ;;
              *) exit 1 ;;
            esac
          done
          if [ "$FULL" = true ]; then
            echo "All parallel CI checks and integration test suites succeeded."
          else
            echo "V8-only change: the full suite runs again on merge before release packaging."
          fi

