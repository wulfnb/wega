name: CD - Build & Publish Test Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom tag name for the release (e.g. test-preview)'
        required: false
        default: 'test-preview'

# No default token scopes: each job requests only what it needs, and only the
# publishing jobs receive write or OIDC (attestation) permissions.
permissions: {}

# A newer push to main supersedes the moving test-preview; release tags always finish.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Runs in parallel with packaging. Nothing is published, and the image is not
  # promoted to :latest/:test, until this passes (publish-release needs it).
  ci-validation:
    name: Require CI before release publishing
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  build-macos:
    name: Package macOS Bundle (ARM64)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 4
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-cd-macos"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Native system dependencies
        run: brew install pkgconf gstreamer libnice-gstreamer
      - name: Install license notice generator
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - name: Build and bundle Wega.app
        run: bash scripts/package-macos.sh
      # Cargo caches can restore old reports; every workflow attempt needs a fresh output.
      - name: Verify both engines in the packaged app
        run: env -u WEGA_ENGINE_BINARY -u GST_PLUGIN_PATH -u GST_PLUGIN_SYSTEM_PATH python3 scripts/browser-bench.py --binary target/Wega.app/Contents/MacOS/wega --output target/packaged-compatibility/${{ github.run_id }}-${{ github.run_attempt }} --mode compatibility
      - name: Verify container accounts in the packaged app
        run: env -u WEGA_ENGINE_BINARY -u GST_PLUGIN_PATH -u GST_PLUGIN_SYSTEM_PATH python3 tests/containers_smoke.py --binary target/Wega.app/Contents/MacOS/wega --output target/packaged-containers/${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-containers-macos
          path: target/packaged-containers/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-compatibility-macos
          path: target/packaged-compatibility/${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Create DMG and ZIP distributions
        run: |
          mkdir -p dist
          # Stage a complete app beside the familiar Applications drag target.
          staging_dir="$(mktemp -d)"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rm -rf "$staging_dir" "$mount_dir"' EXIT
          ditto target/Wega.app "$staging_dir/Wega.app"
          ln -s /Applications "$staging_dir/Applications"
          cp docs/install-macos.txt "$staging_dir/Read Me.txt"
          hdiutil create -volname "Wega Browser" -srcfolder "$staging_dir" -ov -format UDZO dist/Wega-macOS-arm64.dmg
          # Check the actual mounted distribution, not just the staging folder.
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" dist/Wega-macOS-arm64.dmg
          test -f "$mount_dir/Wega.app/Contents/Info.plist"
          test -x "$mount_dir/Wega.app/Contents/MacOS/wega"
          test -x "$mount_dir/Wega.app/Contents/MacOS/wega-engine"
          test -s "$mount_dir/Wega.app/Contents/Resources/WEGA-ENGINE-THIRD-PARTY-NOTICES.html"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          test -f "$mount_dir/Read Me.txt"
          hdiutil detach "$mount_dir"
          # Create standard portable archive (.zip)
          ditto -c -k --sequesterRsrc --keepParent target/Wega.app dist/Wega-macOS-arm64.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-dist
          path: dist/*

  build-linux-binaries:
    name: Build Linux Binaries
    runs-on: ubuntu-24.04
    # Same RUST_IMAGE as the Dockerfile builder, so the binaries match the trixie runtime.
    container: rust:1.98.0-slim-trixie
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Native build dependencies
        run: apt-get update && xargs -a docker/builder-packages.txt apt-get install -y --no-install-recommends
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-cd-linux"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install license notice generator
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - name: Build release binaries and license notices
        run: bash scripts/build-linux-binaries.sh dist/docker desktop --notices
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-binaries-release
          path: dist/docker/
          retention-days: 1

  build-linux-and-docker:
    needs: build-linux-binaries
    name: Build Linux Package & Docker (GHCR)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.published-image.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-binaries-release
          path: dist/docker
      # Artifacts drop the executable bit.
      - name: Restore binary permissions
        run: chmod 755 dist/docker/wega dist/docker/wega-engine
      - name: Set lowercased image repository name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production Docker image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: runtime-prebuilt
          push: false
          load: true
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # GHCR, not the 10 GB Actions cache.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
      - name: Scan production Docker image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Install license notice generator
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - name: Extract standalone Linux binary from built image
        run: |
          mkdir -p dist
          container_id=$(docker create "${{ env.IMAGE_NAME }}:${{ github.sha }}")
          docker cp "$container_id:/usr/local/bin/wega" ./wega-linux
          docker cp "$container_id:/usr/local/bin/wega-engine" ./wega-engine
          docker rm "$container_id"
          chmod 755 ./wega-linux ./wega-engine
          bash scripts/package-linux.sh ./wega-linux
      - name: Verify both engines from the Linux archive
        run: |
          mkdir -p target/packaged-compatibility-linux/${{ github.run_id }}-${{ github.run_attempt }}
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh \
            -e HOME=/tmp -e XDG_CONFIG_HOME=/tmp/config -e XDG_CACHE_HOME=/tmp/cache -e XDG_DATA_HOME=/tmp/data \
            -e DISPLAY=:97 -e LIBGL_ALWAYS_SOFTWARE=1 -e GITHUB_SHA \
            -v "$PWD:/source:ro" -v "$PWD/target/packaged-compatibility-linux/${{ github.run_id }}-${{ github.run_attempt }}:/results" \
            "${IMAGE_NAME}:${GITHUB_SHA}" -eu -c '
              mkdir /tmp/package
              tar -xzf /source/dist/Wega-Linux-x86_64.tar.gz -C /tmp/package
              /tmp/package/wega-linux-x86_64/bin/wega --help >/tmp/launcher-help.txt
              Xvfb :97 -screen 0 1440x900x24 -nolisten tcp -ac >/tmp/bench-display.log 2>&1 &
              display_pid=$!
              trap "kill $display_pid 2>/dev/null || true" EXIT
              attempts=0
              until xdpyinfo >/dev/null 2>&1; do
                attempts=$((attempts + 1)); test "$attempts" -le 50; sleep 0.2
              done
              python3 /source/scripts/browser-bench.py --binary /tmp/package/wega-linux-x86_64/libexec/wega --output /results/run --mode compatibility --label packaged-linux-release
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-compatibility-linux
          path: target/packaged-compatibility-linux/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-dist
          path: dist/Wega-Linux-x86_64.tar.gz
      # Only the per-commit tag here; publish-release promotes it after CI passes.
      - name: Publish the validated Docker image
        id: published-image
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          published_digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_NAME}:${GITHUB_SHA}" | awk -F@ -v repository="$IMAGE_NAME" '$1 == repository {print $2; exit}')
          [[ "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$published_digest" >> "$GITHUB_OUTPUT"
      - name: Attest Docker image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.published-image.outputs.digest }}
          push-to-registry: true

  build-windows:
    name: Package Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-cd-windows"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore pinned media SDK installer
        id: media-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: gstreamer-msvc-1.28.8-${{ hashFiles('scripts/install-windows-media.ps1') }}
      - name: Install pinned media SDK
        shell: pwsh
        run: scripts\install-windows-media.ps1
      - name: Save pinned media SDK installer
        if: steps.media-sdk.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gstreamer-msvc-1.28.8.exe
          key: ${{ steps.media-sdk.outputs.cache-primary-key }}
      - name: Build the independent Wega engine
        run: python scripts/build-wega-engine.py
      - name: Build Windows release executable
        env:
          RUSTFLAGS: "-C link-arg=msvcprt.lib"
        run: cargo build --release --locked --no-default-features --features desktop,brotli-streams,media
      - name: Install license notice generator
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - name: Write LICENSE, NOTICE and THIRD-PARTY-NOTICES.html
        shell: bash
        run: bash scripts/third-party-notices.sh dist/wega-windows-x64 --no-default-features --features "desktop brotli-streams media" --target x86_64-pc-windows-msvc
      - name: Package Windows ZIP archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\wega-windows-x64
          if (!(Test-Path "target\release\wega.exe")) {
            throw "Windows browser executable is missing; refusing an incomplete release"
          }
          Copy-Item "target\release\wega.exe" -Destination "dist\wega-windows-x64\"
          Copy-Item "target\release\wega-engine.exe" -Destination "dist\wega-windows-x64\"
          # wega.exe links ANGLE (libEGL/libGLESv2) dynamically; without them it cannot start.
          foreach ($dll in "libEGL.dll", "libGLESv2.dll") {
            $built = Get-ChildItem "target\release\build\mozangle-*\out\$dll" | Select-Object -First 1
            if (!$built) {
              throw "$dll is missing; refusing a release that cannot start"
            }
            Copy-Item $built.FullName -Destination "dist\wega-windows-x64\"
          }
          foreach ($notice in "LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.html", "WEGA-ENGINE-THIRD-PARTY-NOTICES.html") {
            if (!(Test-Path "dist\wega-windows-x64\$notice")) {
              throw "$notice is missing; refusing a release without license notices"
            }
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" -Destination "dist\wega-windows-x64\"
          }
          python scripts\bundle-windows-media.py --destination dist\wega-windows-x64
          if ($LASTEXITCODE -ne 0) { throw "Media runtime bundling failed" }
          Compress-Archive -Path "dist\wega-windows-x64\*" -DestinationPath "dist\Wega-Windows-x64.zip" -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($compiler) { $iscc = $compiler.Source }
          else { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 compiler is required for the Windows installer" }
          & $iscc packaging\windows\wega.iss
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }
      - name: Check per-user install and uninstall
        shell: pwsh
        run: scripts\windows-installer-check.ps1
      - name: Launch the packaged executable
        shell: pwsh
        run: scripts\windows-launch-check.ps1 -Directory dist\wega-windows-x64
      - name: Test packaged media and URL handoff without installed SDK
        run: python scripts/windows-runtime-test.py --binary dist/wega-windows-x64/wega.exe
      - name: Verify both engines in the packaged directory
        shell: pwsh
        run: |
          Remove-Item Env:WEGA_ENGINE_BINARY -ErrorAction SilentlyContinue
          Remove-Item Env:GST_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:GST_PLUGIN_SYSTEM_PATH -ErrorAction SilentlyContinue
          python scripts/browser-bench.py --binary dist/wega-windows-x64/wega.exe --output target/packaged-compatibility/${{ github.run_id }}-${{ github.run_attempt }} --mode compatibility
          if ($LASTEXITCODE -ne 0) { throw "Packaged engine compatibility failed" }
      - name: Verify container accounts in the packaged directory
        shell: pwsh
        run: |
          Remove-Item Env:WEGA_ENGINE_BINARY -ErrorAction SilentlyContinue
          Remove-Item Env:GST_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:GST_PLUGIN_SYSTEM_PATH -ErrorAction SilentlyContinue
          python tests/containers_smoke.py --binary dist/wega-windows-x64/wega.exe --output target/packaged-containers/${{ github.run_id }}-${{ github.run_attempt }}
          if ($LASTEXITCODE -ne 0) { throw "Packaged container isolation failed" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-containers-windows
          path: target/packaged-containers/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: packaged-compatibility-windows
          path: target/packaged-compatibility/${{ github.run_id }}-${{ github.run_attempt }}/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: windows-runtime-release
          path: target/windows-runtime-tests/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-dist
          path: |
            dist/Wega-Windows-x64.zip
            dist/Wega-Windows-x64-Setup.exe

  publish-release:
    name: Publish GitHub Test Release
    needs: [ci-validation, build-macos, build-linux-and-docker, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set lowercased image repository name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the CI-validated image to latest and test
        env:
          DIGEST: ${{ needs.build-linux-and-docker.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:latest" --tag "${IMAGE_NAME}:test" "${IMAGE_NAME}@${DIGEST}"
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-dist'
          path: release-artifacts
          merge-multiple: true
      - name: Prepare distribution directory & checksums
        run: |
          mkdir -p release-files
          cp release-artifacts/* release-files/
          cd release-files
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS.txt
      - name: Determine Release Tag and validate version
        id: tag
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release_tag }}
        shell: python
        run: |
          import os, re, tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          ref = os.environ.get('GITHUB_REF', '')
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          release_input = os.environ.get('RELEASE_INPUT', '')

          if event_name == 'workflow_dispatch' and release_input:
              release_tag = release_input
              commit_tag = ''
          elif ref.startswith('refs/tags/'):
              release_tag = ref.removeprefix('refs/tags/')
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?', release_tag) or release_tag != 'v' + version:
                  raise SystemExit(f"Release tag '{release_tag}' must equal 'v' + Cargo.toml version ('v{version}')")
              commit_tag = ''
          else:
              release_tag = 'test-preview'
              sha = os.environ.get('GITHUB_SHA', '')[:12]
              commit_tag = f'test-preview-{sha}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'RELEASE_TAG={release_tag}\n')
              if commit_tag:
                  output.write(f'COMMIT_TAG={commit_tag}\n')
      - name: Write release notes
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > release-notes.md <<EOF
          ## Wega Browser — Test / Preview Release

          This is an automated test release built directly from commit \`$GITHUB_SHA\` on branch \`$REF_NAME\`.

          ### Multi-Platform Downloads

          | Platform | Distribution Package | Description |
          | :--- | :--- | :--- |
          | **macOS (Apple Silicon)** | \`Wega-macOS-arm64.dmg\` / \`.zip\` | Native macOS app bundle (\`Wega.app\`) with GStreamer media plugins and AppKit vibrancy |
          | **Linux (x86_64)** | \`Wega-Linux-x86_64.tar.gz\` | Portable Linux archive with standalone launcher and desktop entry |
          | **Windows (x64)** | \`Wega-Windows-x64.zip\` | Portable Windows archive with \`wega.exe\` and documentation |

          Every download contains \`LICENSE\` (MPL-2.0), \`NOTICE\` and \`THIRD-PARTY-NOTICES.html\`.
          The macOS app uses Apple's system codecs and bundles no FFmpeg, x264 or other GPL codecs.

          ### Docker Container (noVNC / HTTPS Gateway)

          You can pull and launch the full containerized browser with its secure authenticated web viewer:

          \`\`\`sh
          docker pull $IMAGE_NAME:latest

          docker run -d \\
            --name wega-browser \\
            -p 127.0.0.1:7443:7443 \\
            -e BROWSER_USER=servo \\
            -e BROWSER_PASSWORD='your-strong-password' \\
            -v wega-profile:/config \\
            $IMAGE_NAME:latest
          \`\`\`

          Then navigate to **https://localhost:7443** in your local browser and sign in.
          Never expose port 7443 directly to the internet; use Tailscale/WireGuard or a trusted reverse proxy for remote access.

          ### Integrity & Provenance

          SHA256 checksums are provided in \`SHA256SUMS.txt\`. Every archive and the Docker image carry
          a GitHub build-provenance attestation:

          \`\`\`sh
          gh attestation verify Wega-macOS-arm64.dmg --repo $REPOSITORY
          gh attestation verify oci://$IMAGE_NAME:$GITHUB_SHA --repo $REPOSITORY
          \`\`\`
          EOF
      - name: Create or Update GitHub Pre-Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Wega Test Release (${{ steps.tag.outputs.RELEASE_TAG }})"
          prerelease: true
          make_latest: false
          files: |
            release-files/*
          body_path: release-notes.md
      - name: Create immutable per-commit Pre-Release
        if: steps.tag.outputs.COMMIT_TAG != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.COMMIT_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Wega Test Release (${{ steps.tag.outputs.COMMIT_TAG }})"
          prerelease: true
          make_latest: false
          overwrite_files: false
          files: |
            release-files/*
          body_path: release-notes.md
