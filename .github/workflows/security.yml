name: Security SAST Analysis

# Daily, so a new advisory against unchanged code is reported without waiting for a commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Vendored upstream sources are tracked by their own projects and by cargo audit.
          config: |
            paths-ignore:
              - vendor
              - engines/vendor
              - engines/v8-spike
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: "/language:${{ matrix.language }}"

  rust-advisories:
    name: RustSec advisories (all lockfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit@0.22.2
      # Same checks as the CI lint job; each workspace reads its own .cargo/audit.toml.
      # Keep registry fetching enabled: --no-fetch also prevents cargo-audit
      # from loading sparse index entries needed for yanked checks.
      - name: Browser workspace
        run: cargo audit
      - name: Engine workspace
        if: ${{ !cancelled() }}
        working-directory: engines
        run: cargo audit
      - name: V8 spike workspace
        if: ${{ !cancelled() }}
        run: cargo audit --file engines/v8-spike/Cargo.lock
      - name: Error collector workspace
        if: ${{ !cancelled() }}
        run: cargo audit --file error-collector/Cargo.lock

  # The release image is scanned when it is built; base-image CVEs published
  # afterwards only show up by rescanning what users actually pull.
  published-image:
    name: Trivy scan of published image
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Set lowercased image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - name: Scan for code scanning (all fixable findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload findings to code scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-published-image
      - name: Fail on fixable high or critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_SKIP_DB_UPDATE: 'true'
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
