name: V8 Engine (Deno)

# Separate from CI/CD: guards the V8 migration (docs/v8-engine-plan.md).
# CI  - pinned Deno sources plus the documented embedding patch build on every platform.
# CD  - the pinned prebuilt V8 libraries are still published upstream, and a verified copy
#       is kept as this repository's pre-release (Deno development ends ~October 2027).
on:
  pull_request:
    paths:
      - 'engines/v8-spike/**'
      - 'engines/wega/**'
      - 'engines/Cargo.toml'
      - 'engines/Cargo.lock'
      - 'engines/vendor/**'
      - 'docs/v8-engine-plan.md'
      - '.github/workflows/v8-engine.yml'
  push:
    branches: [main]
    paths:
      - 'engines/v8-spike/**'
      - 'engines/wega/**'
      - 'engines/Cargo.toml'
      - 'engines/Cargo.lock'
      - 'engines/vendor/**'
      - '.github/workflows/v8-engine.yml'
  schedule:
    # Weekly early warning if upstream removes the prebuilt V8 libraries.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: v8-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  V8_VERSION: '150.4.0'
  V8_MIRROR_TAG: deno-v8-mirror-150.4.0

jobs:
  vendor-integrity:
    name: Vendored Deno sources match pinned releases and embedding patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Compare with the crates.io releases and documented embedding patch
        run: |
          set -eu
          scratch="$RUNNER_TEMP/crates"
          mkdir -p "$scratch"
          for spec in deno_core@0.413.0 deno_ops@0.289.0 serde_v8@0.322.0 deno_v8@0.5.0; do
            name=${spec%@*}; version=${spec#*@}
            test -s "engines/vendor/deno/$name/LICENSE.md"
            curl -fsSL --retry 3 "https://static.crates.io/crates/$name/$name-$version.crate" | tar -xz -C "$scratch"
            if [ "$name" = deno_core ]; then
              patch --batch --forward -d "$scratch/$name-$version" -p1 < "$GITHUB_WORKSPACE/engines/vendor/deno/patches/embed-extension-sources.patch"
            fi
            if ! diff -r -x LICENSE.md "$scratch/$name-$version" "engines/vendor/deno/$name"; then
              echo "::error::engines/vendor/deno/$name differs from crates.io $name $version; document the change in engines/vendor/README.md"
              exit 1
            fi
            echo "$name $version matches crates.io"
          done

  prebuilt-availability:
    name: Pinned V8 prebuilt libraries are available
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download from denoland/rusty_v8 and verify checksums
        run: |
          set -u
          sums="$GITHUB_WORKSPACE/engines/vendor/deno/V8-PREBUILT-SHA256SUMS"
          mkdir -p "$RUNNER_TEMP/v8/v$V8_VERSION"
          cd "$RUNNER_TEMP/v8/v$V8_VERSION"
          missing=0
          while read -r _ name; do
            if ! curl -fsSL --retry 3 -o "$name" "https://github.com/denoland/rusty_v8/releases/download/v$V8_VERSION/$name"; then
              echo "::error::$name is no longer published by denoland/rusty_v8; build with RUSTY_V8_MIRROR from the $V8_MIRROR_TAG release"
              missing=1
            fi
          done < "$sums"
          test "$missing" = 0
          sha256sum -c "$sums"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: v8-prebuilt
          path: ${{ runner.temp }}/v8/
          retention-days: 1

  spike:
    name: V8 + Blitz spike (${{ matrix.os }})
    needs: vendor-integrity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: engines/v8-spike
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "wega-v8-spike-${{ matrix.os }}"
          workspaces: "engines/v8-spike -> target"
      - name: Native system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Select verified mirror only when upstream downloads fail
        working-directory: .
        run: python scripts/v8_prebuilt.py --github-env "$GITHUB_ENV"
      - name: Lints
        run: cargo clippy --locked --release --no-deps --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release
      - name: V8 mutates and paints Blitz's DOM
        run: ./target/release/v8-spike v8 | tee "$RUNNER_TEMP/v8.txt"
      - name: QuickJS baseline
        run: ./target/release/v8-spike quickjs | tee "$RUNNER_TEMP/quickjs.txt"
      - name: Real engine V8 contracts
        working-directory: .
        run: cargo test --locked --manifest-path engines/Cargo.toml --no-default-features --features v8 --target-dir target/v8-engine
      - name: Real engine QuickJS contracts
        working-directory: .
        run: cargo test --locked --manifest-path engines/Cargo.toml --no-default-features --features quickjs --target-dir target/v8-engine
      - name: Real engine formatting and lints
        working-directory: .
        run: |
          cargo fmt --manifest-path engines/Cargo.toml --check
          cargo clippy --locked --manifest-path engines/Cargo.toml --all-targets --no-default-features --features v8 --target-dir target/v8-engine -- -D warnings
          cargo clippy --locked --manifest-path engines/Cargo.toml --all-targets --no-default-features --features quickjs --target-dir target/v8-engine -- -D warnings
      - name: Report
        run: |
          {
            echo "### V8 spike on ${{ runner.os }}"
            echo '```'
            cat "$RUNNER_TEMP/v8.txt" "$RUNNER_TEMP/quickjs.txt"
            du -h target/release/v8-spike target/release/v8-spike.exe 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-mirror:
    name: Keep a verified copy of the V8 prebuilt libraries
    if: github.event_name != 'pull_request'
    needs: [prebuilt-availability, spike]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v8-prebuilt
          path: v8
      - name: Create the mirror pre-release once
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$V8_MIRROR_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # Existing assets are immutable; only report what is there.
            gh release view "$V8_MIRROR_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name'
            exit 0
          fi
          cat > notes.md <<EOF
          Verified copy of the prebuilt V8 $V8_VERSION static libraries and generated bindings
          downloaded by the \`v8\` crate (denoland/rusty_v8). Checksums are pinned in
          \`engines/vendor/deno/V8-PREBUILT-SHA256SUMS\`. Not a Wega release.

          To build from this copy: download every asset into \`<dir>/v$V8_VERSION/\`, then
          \`RUSTY_V8_MIRROR=<dir> cargo build\`. See docs/v8-engine-plan.md.
          EOF
          gh release create "$V8_MIRROR_TAG" --repo "$REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Deno V8 $V8_VERSION mirror" --notes-file notes.md \
            "v8/v$V8_VERSION"/*

  v8-gate:
    name: V8 Engine Gate
    if: always()
    needs: [vendor-integrity, prebuilt-availability, spike]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all V8 checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done
