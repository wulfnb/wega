[package]
name = "wega-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Wega's experimental Blitz-based page engine"

[dependencies]
deno_core = "=0.413.0"
wega-network = {path="../network"}
wega-platform = {path="../platform"}
deno_error = "=0.7.1"
tokio = {version="1",features=["rt","time","net","sync"]}
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff", "autofocus", "scrollbars"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", features = ["scrollbars"] }
blitz-traits = "=0.3.0-beta.4"
anyrender = "=0.14.0"
anyrender_skia = "=0.12.0"
skia-safe = "=0.153.3"
kurbo = "=0.13.1"
html5ever = "0.40.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "cookies"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2.5"
data-url = "0.3"

deno_webidl = "=0.260.0"
deno_web = "=0.291.0"
deno_fetch = "=0.284.0"
deno_websocket = "=0.265.0"
deno_webstorage = "=0.255.0"
deno_crypto = "=0.274.0"
deno_permissions = "=0.119.0"
sys_traits = {version="=0.1.29",features=["real","libc","winapi"]}
sha2 = "0.10"

deno_net = "=0.252.0"

deno_tls = "=0.247.0"

style = {package="stylo",version="=0.22.0"}

cssparser = "=0.38.0"
selectors = "=0.41.0"
style_traits = {package="stylo_traits",version="=0.22.0"}

cookie_store = "=0.22.1"
publicsuffix = "=2.3.0"
keyboard-types = "=0.8.3"

[build-dependencies]
wega-network = {path="../network"}
serde = {version="1",features=["derive"]}
deno_core = "=0.413.0"
deno_error = "=0.7.1"
serde_json = "1"
url = "2.5"
deno_webidl = "=0.260.0"
deno_web = "=0.291.0"
deno_fetch = "=0.284.0"
deno_websocket = "=0.265.0"
deno_webstorage = "=0.255.0"
deno_crypto = "=0.274.0"
deno_permissions = "=0.119.0"
deno_net = "=0.252.0"
deno_tls = "=0.247.0"
tokio = {version="1",features=["rt","time","net","sync"]}

[dev-dependencies]
tempfile = "3"
