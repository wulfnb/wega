[package]
name = "wega-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Wega's experimental Blitz-based page engine"

[dependencies]
wega-protocol = { path = "../protocol" }
wega-network = {path="../network"}
wega-security = { path = "../services/security" }
wega-permissions = { path = "../services/permissions" }
wega-adapter-skia = { path = "../adapters/skia" }
wega-adapter-v8 = { path = "../adapters/v8" }
wega-adapter-blitz = { path = "../adapters/blitz" }
wega-dom = { path = "../dom/core" }
wega-html = { path = "../html/parser" }
wega-platform = {path="../platform"}
tokio = {version="1",features=["rt","time","net","sync"]}
base64 = "0.23"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "svg", "woff", "autofocus", "scrollbars", "floats", "error-diagnostics", "accessibility", "file-input"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", features = ["scrollbars"] }
blitz-traits = "=0.3.0-beta.4"
accesskit = { version = "=0.25.2", features = ["serde"] }
anyrender = "=0.14.0"
skia-safe = "=0.153.3"
html5ever = "0.40.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli", "cookies"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2.5"
data-url = "0.3"
encoding_rs = "0.8.35"

sha2 = "0.11"



style = {package="stylo",version="=0.22.0"}

cssparser = "=0.38.0"
selectors = "=0.42.0"
style_traits = {package="stylo_traits",version="=0.22.0"}
style_dom = {package="stylo_dom",version="=0.22.0"}

cookie_store = "=0.22.1"
publicsuffix = "=2.3.0"
keyboard-types = "=0.8.3"

[build-dependencies]
sha2 = "0.11"
wega-adapter-v8 = { path = "../adapters/v8" }
serde = {version="1",features=["derive"]}
serde_json = "1"
url = "2.5"

[dev-dependencies]
# Only the packaging test in dom_host.rs uses deno_core's include_js_files! macro.
deno_core = "=0.413.0"
sha1 = "0.11"
tempfile = "3"
