# Configuration for cargo-audit (RustSec) in the engine workspace.
#
# Every entry below arrives through the pinned Deno crates (deno_tls pins
# rustls "=0.23.40"), so a lockfile-only update is rejected. They are cleared by
# the coherent Deno TLS/net/crypto update, not one crate at a time.
# Review on or before 2027-02-01: remove each ID as soon as the Deno pin moves.
# Any advisory NOT listed here fails CI and the scheduled security scan.

[advisories]
ignore = [
    "RUSTSEC-2026-0387",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0285",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
]
