[package]
name = "wega-adapter-blitz"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Wega's Blitz adapter: the Blitz document behind the wega-dom contract"

[dependencies]
wega-dom = { path = "../../dom/core" }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
html5ever = "0.40.1"
url = "2.5"
style = { package = "stylo", version = "=0.22.0" }
style_traits = { package = "stylo_traits", version = "=0.22.0" }
cssparser = "=0.38.0"

[dev-dependencies]
wega-html = { path = "../../html/parser" }
