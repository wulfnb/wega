[package]
name = "wega-layout-text"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Text shaping, measurement and line breaking (Parley)"

[dependencies]
wega-layout-core = { path = "../core" }
wega-css-values = { path = "../../css/values" }
wega-style = { path = "../../css/style-engine" }
wega-dom = { path = "../../dom/core" }
parley = { version = "=0.12.0", features = ["system", "complex-scripts"] }
anyrender = "=0.14.0"
kurbo = "=0.13.1"
