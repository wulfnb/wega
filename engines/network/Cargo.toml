[package]
name = "wega-network"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
url = "2.5"
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls","gzip","brotli","cookies"]}
cookie_store = {version="=0.22.1",features=["public_suffix"]}
publicsuffix = "=2.3.0"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
