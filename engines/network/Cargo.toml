[package]
name = "wega-network"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
wega-platform = { path = "../platform" }
wega-protocol = { path = "../protocol" }
serde = {version="1",features=["derive"]}
serde_json = "1"
url = {version="2.5", features=["serde"]}
reqwest = {version="0.12",default-features=false,features=["blocking","rustls-tls","gzip","brotli","cookies"]}
cookie_store = {version="=0.22.1",features=["public_suffix"]}
publicsuffix = "=2.3.0"
getrandom = "0.3"

sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
fontdb = "=0.24.0"
rusqlite = { version = ">=0.38, <0.41", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
