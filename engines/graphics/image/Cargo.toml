[package]
name = "wega-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Bounded raster and SVG decoding of authorized bytes"

[dependencies]
wega-dom = { path = "../../dom/core" }
anyrender = "=0.14.0"
anyrender_svg = "=0.15.0"
usvg = "=0.48.1"
svgtypes = "=0.16.1"
kurbo = "=0.13.1"
peniko = "=0.6.1"
parley = { version = "=0.12.0", features = ["system", "complex-scripts"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1"

[dev-dependencies]
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flate2 = "1"
usvg = "=0.48.1"
