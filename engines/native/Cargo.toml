[package]
name = "wega-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Wega-owned CSS, layout, shaping and display-list algorithms"

[dependencies]
wega-dom = { path = "../dom/core" }
anyrender = "=0.14.0"
anyrender_svg = "=0.15.0"
usvg = "=0.48.1"
svgtypes = "=0.16.1"
cssparser = "=0.38.0"
parley = { version = "=0.12.0", features = ["system", "complex-scripts"] }
kurbo = "=0.13.1"
peniko = "=0.6.1"

[dev-dependencies]
html5ever = "0.40.1"
wega-html = { path = "../html/parser" }
url = "2.5"
anyrender_skia = "=0.12.0"
