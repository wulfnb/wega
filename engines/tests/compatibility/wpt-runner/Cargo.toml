[package]
name = "wega-wpt-runner"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Runs upstream web-platform-tests (reftests and testharness) against the Wega engine."

[[bin]]
name = "wpt-runner"
path = "src/main.rs"

[dependencies]
wega-engine = { path = "../../../wega" }
serde_json = "1"
url = "2.5"
skia-safe = "=0.153.3"
