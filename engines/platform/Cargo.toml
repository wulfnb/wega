[package]
name = "wega-platform"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
memmap2 = "0.9"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
