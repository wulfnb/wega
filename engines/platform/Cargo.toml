[package]
name = "wega-platform"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
memmap2 = "0.9"
tempfile = "3"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Debug"] }
