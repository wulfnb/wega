[package]
name = "wega-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
description = "Wega's persistent origin storage: Cache Storage, Cache API and IndexedDB (extracted from wega-network)"

[dependencies]
serde = {version="1",features=["derive"]}
serde_json = "1"
url = {version="2.5", features=["serde"]}
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
